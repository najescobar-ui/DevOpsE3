apiVersion: v1
kind: Service
metadata:
  name: tienda-frontend
  namespace: tienda
  # Sin anotaciones del AWS Load Balancer Controller: en AWS Academy no se puede
  # instalar (requiere rol IAM). Así EKS crea un Classic ELB público automáticamente.
spec:
  type: LoadBalancer
  selector:
    app: tienda-frontend
  ports:
    - port: 80
      targetPort: 80
